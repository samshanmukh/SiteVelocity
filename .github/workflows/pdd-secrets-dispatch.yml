# Managed by PDD GitHub App; edits may be replaced.
name: PDD Secrets Dispatch

on:
  repository_dispatch:
    types: [pdd-secrets]

permissions: {}

jobs:
  provide-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt and send requested secrets
        shell: node {0}
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          PAYLOAD_CONTEXT: ${{ toJSON(github.event.client_payload) }}
          WORKER_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAwLc2Vn2VErKtvPa27Iek
            ePSZuWdagaiA9wfce4+4GR3aDNCsv24btyttNapgqO1pkB7mVATp4WJCD7F3CDMU
            ddDsi07PReXJrdMp+/IC0eGblHPPpJyZOh/5ZoIo2oJPOHjGWwEQO75JgT8jtvUh
            L2o7lYuFS1BwMQpdHifpxDWdn8yXo6SvV7k0UISEWKn5sa4gcalOhYiEjFUNt4pt
            a7/HJQQu6K3AJKoUT8eTsftV5o1SHP0C8wB85hOehdzEM5uSpCb6aZ/cVqU38z15
            NjqEVabaUquswZwHQ1aHmK+CktX0KfBKa/DYk4ZqW1gMGXgakbj6lsDTcPXzWUtm
            jwIDAQAB
            -----END PUBLIC KEY-----
        run: |
          const crypto = require('crypto');
          const https = require('https');

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          function postJson(url, value) {
            return new Promise((resolve, reject) => {
              if (url.protocol !== 'https:') {
                reject(new Error('callback URL must use HTTPS'));
                return;
              }
              const body = Buffer.from(JSON.stringify(value), 'utf8');
              const request = https.request(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': body.length,
                },
                timeout: 30000,
              }, (response) => {
                response.resume();
                response.on('end', () => resolve(response.statusCode));
              });
              request.on('timeout', () => request.destroy(new Error('callback timed out')));
              request.on('error', reject);
              request.end(body);
            });
          }

          async function encryptAndSend() {
            const secretsMap = JSON.parse(process.env.SECRETS_CONTEXT || '{}');
            const payload = JSON.parse(process.env.PAYLOAD_CONTEXT || '{}');
            const publicKey = process.env.WORKER_PUBLIC_KEY;
            const jobId = payload.job_id;
            const callbackUrl = payload.callback_url;
            const callbackToken = payload.callback_token;
            const requiredKeys = payload.required_secrets || [];

            if (!jobId || !callbackUrl || !callbackToken || !publicKey) {
              fail('missing job_id, callback_url, callback_token, or worker public key');
            }
            if (!Array.isArray(requiredKeys) || requiredKeys.some((key) => typeof key !== 'string')) {
              fail('required_secrets must be a list of strings');
            }

            const selected = {};
            const keys = requiredKeys.length ? requiredKeys : Object.keys(secretsMap);
            for (const key of keys) {
              if (Object.prototype.hasOwnProperty.call(secretsMap, key)) {
                selected[key] = secretsMap[key];
              }
            }

            const aesKey = crypto.randomBytes(32);
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', aesKey, iv);
            const encrypted = Buffer.concat([
              cipher.update(Buffer.from(JSON.stringify(selected), 'utf8')),
              cipher.final(),
              cipher.getAuthTag(),
            ]);
            const encryptedKey = crypto.publicEncrypt({
              key: publicKey,
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: 'sha256',
            }, aesKey);
            const envelope = {
              version: 2,
              encrypted_key: encryptedKey.toString('base64'),
              iv: iv.toString('base64'),
              ciphertext: encrypted.toString('base64'),
            };
            const encryptedPayload = Buffer.from(JSON.stringify(envelope), 'utf8').toString('base64');
            const status = await postJson(new URL(callbackUrl), {
              job_id: jobId,
              encrypted_secrets: encryptedPayload,
              callback_token: callbackToken,
            });
            if (status !== 200) {
              fail(`callback failed with HTTP ${status}`);
            }
            console.log(`Successfully sent secrets for job ${jobId}`);
          }

          encryptAndSend().catch((error) => fail(error.message));
