# Render Blueprint for the SiteVelocity Alpha web app and ingestion scheduler.
# Render Workflows are created/released separately because Render Blueprints do
# not currently manage Workflow services. The Workflow uses this same repository
# and branch; docs/runbooks/render-deployment.md records that required setup.
# Secrets are presence-only here (sync: false) — values live in the Render
# dashboard environment, never in this file.
# Platform health checks use the liveness route, never the provider-diagnostics route.

services:
  - type: web
    name: sitevelocity-web
    runtime: node
    plan: starter
    region: oregon
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: LIVE_RESEARCH
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: DEMO_SNAPSHOT_ID
        sync: false
      - key: LAST_KNOWN_GOOD_RELEASE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PERSISTENCE_BACKEND
        value: supabase
      - key: SITEVELOCITY_ORGANIZATION_ID
        sync: false
      - key: WORKFLOW_PROVIDER
        value: render
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_TASK_SLUG
        sync: false
      - key: ROCKETRIDE_APIKEY
        sync: false
      - key: ROCKETRIDE_URI
        value: https://api.rocketride.ai
      - key: ROCKETRIDE_RESEARCH_PIPELINE
        sync: false
      - key: ROCKETRIDE_INGEST_PIPELINE
        sync: false
      - key: RTRVR_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_MODEL
        value: MiniMax-M2.7
      - key: RESEARCH_URL_ALLOWLIST
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      - key: NEXLA_API_URL
        sync: false
      - key: NEXLA_API_KEY
        sync: false
      - key: RESPAN_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_MAPBOX_STYLE_URL
        value: mapbox://styles/mapbox/streets-v12

  - type: cron
    name: sitevelocity-ingestion-schedule
    runtime: node
    plan: starter
    region: oregon
    branch: master
    buildCommand: npm ci
    startCommand: npm run ingest:schedule
    schedule: "0 10 * * *"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: LIVE_RESEARCH
        value: "true"
      - key: PERSISTENCE_BACKEND
        value: supabase
      - key: SITEVELOCITY_ORGANIZATION_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKFLOW_PROVIDER
        value: render
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_TASK_SLUG
        sync: false
      - key: ROCKETRIDE_APIKEY
        sync: false
      - key: ROCKETRIDE_URI
        value: https://api.rocketride.ai
      - key: ROCKETRIDE_RESEARCH_PIPELINE
        sync: false
      - key: ROCKETRIDE_INGEST_PIPELINE
        sync: false
      - key: RTRVR_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_MODEL
        value: MiniMax-M2.7
      - key: RESEARCH_URL_ALLOWLIST
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
